name: Cloudflare foundation
on:
  pull_request:
    paths:
      [
        "cloudflare/**",
        ".github/workflows/cloudflare.yml",
        ".github/workflows/connector-probes.yml",
      ]
  push:
    paths:
      [
        "cloudflare/**",
        ".github/workflows/cloudflare.yml",
        ".github/workflows/connector-probes.yml",
      ]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the checked revision to isolated staging
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - name: Typecheck, deterministic adapter contracts, Durable Object workflows and dry-run builds
        run: npm run check
      - run: python3 scripts/test-legacy-converter.py
      - run: python3 scripts/test-economy-converter.py
  staging:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging
    needs: check
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
